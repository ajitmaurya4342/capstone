spring:
  datasource:
    url: jdbc:h2:mem:busgo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  seed-demo-data: true
  jwt:
    secret: change-this-development-secret-key-please-32chars
    expiration-ms: 86400000

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
